# The live demo: the web app's demo mode (generated sample data, answered by a
# service worker in the browser), published to GitHub Pages. No server, no
# mail, no model — nothing real leaves anyone's machine.
name: Demo site

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package-lock.json"
      - ".github/workflows/demo-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the demo for https://<owner>.github.io/<repo>/
        run: npm run build:demo -w @commitmail/web
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/
      # Pages answers a deep link (/<repo>/inbox) with 404.html; the app then routes it.
      - run: cp apps/web/dist-demo/index.html apps/web/dist-demo/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
