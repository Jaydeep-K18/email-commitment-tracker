# Streamlit settings for the Email Commitment Tracker.
#
# These are privacy settings, not cosmetics (PROJECT_PLAN.md §16). Streamlit's
# defaults bind the dashboard to every network interface and send usage
# telemetry; both are wrong for an app whose premise is that email-derived data
# never leaves this machine.

[server]
# Loopback only — matches the calendar server. Without this Streamlit serves the
# dashboard on the LAN, so anyone on the same wifi could read the commitments
# extracted from your inbox.
address = "127.0.0.1"
headless = true

[browser]
# No telemetry.
gatherUsageStats = false

[theme]
# Light/dark is chosen at runtime from the sidebar and applied by
# dashboard/styles.py, which repaints Streamlit's chrome with CSS variables.
# `base` stays pinned so that repaint always starts from the same known
# baseline; letting Streamlit follow the operating system instead would leave
# the two halves of the page disagreeing about which mode is active.
base = "light"
primaryColor = "#2e6fdb"

# Fonts are the ones Streamlit bundles and serves from its own static
# directory. Nothing here may reference a webfont URL (PROJECT_PLAN.md §16) —
# dashboard/styles.py uses system stacks for the same reason.
