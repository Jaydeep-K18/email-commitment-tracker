# Alembic owns the database schema. The Node server reads and writes the same
# tables but never alters them, so every schema change lives in migrations/.
#
#   alembic upgrade head                 apply every pending migration
#   alembic revision -m "describe it"    start a new migration
#   alembic upgrade head --sql           print the SQL instead of running it
#
# The connection string comes from DATABASE_URL (see src/config.py), the same
# variable the Node server reads, so there is nothing to keep in sync here.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
