# Infrastructure for CommitMail. The application processes (Python worker,
# Express server, React dev server) run on the host; this file runs the
# services they depend on.
#
#   docker compose up -d                       Postgres + Redis
#   docker compose --profile events up -d      + Kafka
#   docker compose --profile streaming up -d   + Kafka + Flink
#
# Every port is bound to 127.0.0.1. These services hold the contents of your
# mailbox and must never be reachable from the rest of your network.
#
# Passwords come from .env next to this file (see .env.example). Compose refuses
# to start if they are missing rather than falling back to a default.

name: commitmail

# The three Flink services share one image, built from streaming/.
x-flink: &flink
  build: ./streaming
  image: commitmail-flink:1.20
  profiles: ["streaming"]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: commitmail
      POSTGRES_USER: commitmail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Timestamps are stored as naive UTC. Pinning the server's zone means a
      # stray now() without a conversion still lands in UTC.
      TZ: UTC
      PGTZ: UTC
    ports:
      # POSTGRES_PORT moves the host side when 5432 is already taken (another
      # project's database, say). DATABASE_URL must use the same port.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitmail -d commitmail"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only persistence: delayed retries live in Redis between attempts,
    # and should survive a container restart. (They can also be rebuilt from
    # the jobs table, which remains the source of truth.)
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One broker that is also its own controller (KRaft), so no ZooKeeper. It
  # carries the event stream: the worker's outbox relay publishes every event,
  # the server streams them to browsers, and Flink reads them for metrics.
  # Kafka holds a copy; Postgres stays the record.
  kafka:
    image: apache/kafka:3.9.1
    profiles: ["events", "streaming"]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # HOST is for the worker and server on this machine; DOCKER is for other
      # containers (Flink), which reach the broker by its service name.
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # A single broker can hold one copy of anything.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created deliberately (the relay creates its own), so a
      # typo in a consumer cannot conjure an empty topic to wait on forever.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 12

  # Flink: one-minute metrics over the event stream (streaming/job.py), written
  # to metric_snapshots for the System page. Without it the server computes the
  # same metrics from the events table, by the same rules.
  flink-jobmanager:
    <<: *flink
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
    ports:
      # Flink's dashboard, and what the server's health check reads (FLINK_URL).
      - "127.0.0.1:${FLINK_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/overview', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  flink-taskmanager:
    <<: *flink
    command: taskmanager
    depends_on:
      flink-jobmanager: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 1
        taskmanager.memory.process.size: 1728m
      # The job writes its windows to Postgres over the compose network.
      METRICS_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  # Submits the job, and submits it again whenever the cluster has lost it.
  flink-submit:
    <<: *flink
    command: ["python3", "/opt/streaming/supervise.py"]
    depends_on:
      flink-jobmanager: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-commitmail.events}

volumes:
  pgdata:
  redisdata:
  kafkadata:
